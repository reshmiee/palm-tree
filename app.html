<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Palm Tree</title>
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
  <meta name="description" content="Place all your thoughts under this tree." />
  <link rel="stylesheet" href="css/global.css" />
  <link rel="stylesheet" href="css/app.css" />
</head>
<body>

  <!-- ── Full-width search overlay (outside sidebar so it can escape it) ── -->
  <div class="search-overlay hidden" id="search-overlay">
    <div class="search-overlay-bar">
      <span class="search-icon" aria-hidden="true">
        <svg class="icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"></circle><path d="m16 16 4 4"></path></svg>
      </span>
      <input type="text" class="search-input" placeholder="Search notes..." id="search-input" />
      <button class="search-close-btn" id="search-close-btn">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg>
        Close
      </button>
    </div>
    <div class="search-overlay-results" id="panel-search">
      <!-- search results render here -->
    </div>
  </div>

  <div class="app">

    <!-- ── Sidebar ── -->
    <aside class="sidebar">

      <!-- Sidebar Top: logo + search trigger + menu -->
      <div class="sidebar-top">
        <a href="index.html" class="home-btn" title="Back to home" aria-label="Back to home">
          <svg class="icon palm-home-icon" viewBox="0 0 96 96" aria-hidden="true">
            <path d="M42 38c-8-10-20-18-36-20 10-9 29 1 39 13-4-13-13-22-28-28 17-5 31 7 35 24 7-15 20-23 38-19-7 2-22 13-29 27 13-10 25-11 35-4-11 1-26 8-38 20 8-1 17 2 25 8-12 0-23-3-32-7-2 4-3 9-4 15l-3 22H31l5-24c2-8 4-15 6-21-10 0-21 4-31 11 7-11 18-17 31-17Z"></path>
            <path d="M24 89h48v6H24z"></path>
          </svg>
        </a>
        <div class="search-group">
          <button class="back-btn" id="back-btn" aria-label="Go back" title="Go back" disabled>
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg>
          </button>
          <button class="back-btn" id="forward-btn" aria-label="Go forward" title="Go forward" disabled>
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 14l5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/></svg>
          </button>
          <button class="search-trigger" id="search-trigger" aria-label="Search">
            <span class="search-icon" aria-hidden="true">
              <svg class="icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"></circle><path d="m16 16 4 4"></path></svg>
            </span>
            <span class="search-trigger-text">Search...</span>
          </button>
        </div>
        <button class="folder-nav-btn" id="folder-nav-btn" aria-label="Folders" title="Folders">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h5l2 2h7a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"></path></svg>
        </button>
        <div class="menu-wrap">
          <button class="menu-btn" id="menu-btn" aria-label="Menu">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="1"></circle><circle cx="19" cy="12" r="1"></circle><circle cx="5" cy="12" r="1"></circle></svg>
          </button>
          <div class="menu-dropdown hidden" id="menu-dropdown">
            <button class="menu-item" id="export-btn">Export as JSON</button>
            <button class="menu-item" id="import-btn">Import JSON</button>
            <input type="file" id="import-file" accept=".json" class="hidden" />
            <hr class="menu-divider" />
            <button class="menu-item danger" id="clear-btn">Delete all notes</button>
          </div>
        </div>
      </div>

      <!-- Two Tabs -->
      <div class="tabs">
        <button class="tab-btn active" id="tab-recent" aria-label="Recent notes" title="Recent">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"></path><path d="M14 2v6h6"></path><path d="M8 13h8"></path><path d="M8 17h5"></path></svg>
        </button>
        <button class="tab-btn" id="tab-months" aria-label="By month" title="By month">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 2v4"></path><path d="M16 2v4"></path><rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M3 10h18"></path><path d="M8 14h.01"></path><path d="M12 14h.01"></path><path d="M16 14h.01"></path><path d="M8 18h.01"></path><path d="M12 18h.01"></path></svg>
        </button>
        <button class="tab-btn" id="tab-multiselect" aria-label="Select notes" title="Select notes">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" fill="currentColor" stroke="none"><circle cx="5" cy="12" r="1.5"></circle><circle cx="12" cy="12" r="1.5"></circle><circle cx="19" cy="12" r="1.5"></circle></svg>
        </button>
      </div>

      <!-- Bulk action bar (shown during multi-select) -->
      <div class="bulk-bar hidden" id="bulk-bar">
        <span class="bulk-count" id="bulk-count">0 selected</span>
        <div class="bulk-actions">
          <button class="bulk-btn" id="bulk-folder-btn">Add to folder</button>
          <button class="bulk-btn danger" id="bulk-delete-btn">Delete</button>
          <button class="bulk-btn ghost" id="bulk-cancel-btn">Cancel</button>
        </div>
      </div>

      <!-- Tab Panels -->
      <div class="tab-panel active" id="panel-recent">
        <!-- notes list renders here -->
      </div>

      <div class="tab-panel hidden" id="panel-months">
        <!-- months render here -->
      </div>

      <!-- New Note -->
      <div class="sidebar-footer">
        <button class="new-note-btn" id="new-note-btn">+ New Note</button>
      </div>

    </aside>

    <!-- ── Editor ── -->
    <main class="editor">
      <!-- Folder view (shown instead of editor when folders open) -->
      <div class="folder-view hidden" id="folder-view">
        <div class="folder-view-inner" id="folder-view-inner">
          <!-- rendered by folders.js -->
        </div>
      </div>

      <div class="editor-meta">
        <span class="unsaved-dot" id="unsaved-dot"></span>
      </div>
      <textarea
        class="editor-title"
        id="editor-title"
        placeholder="Title"
        rows="1"
        spellcheck="false"
      ></textarea>
      <textarea
        class="editor-body"
        id="editor-body"
        placeholder="Start writing..."
        spellcheck="true"
      ></textarea>
    </main>

  </div>

  <script src="js/storage.js"></script>
  <script src="js/search.js"></script>
  <script src="js/notes.js"></script>
  <script src="js/folders.js"></script>
  <script src="js/export.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
