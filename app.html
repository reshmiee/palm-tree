<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Palm Tree</title>
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
  <meta name="description" content="Place all your thoughts under this tree." />
  <link rel="stylesheet" href="css/global.css" />
  <link rel="stylesheet" href="css/app.css" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;500&display=swap" />
  <!-- CodeMirror 5 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.17/codemirror.min.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.17/addon/lint/lint.min.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.17/codemirror.min.js"></script>
  <!-- Modes -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.17/mode/javascript/javascript.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.17/mode/python/python.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.17/mode/htmlmixed/htmlmixed.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.17/mode/css/css.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.17/mode/clike/clike.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.17/mode/php/php.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.17/mode/ruby/ruby.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.17/mode/go/go.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.17/mode/rust/rust.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.17/mode/swift/swift.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.17/mode/sql/sql.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.17/mode/shell/shell.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.17/mode/yaml/yaml.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.17/mode/xml/xml.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.17/mode/markdown/markdown.min.js"></script>
  <!-- Addons -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.17/addon/edit/matchbrackets.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.17/addon/edit/closebrackets.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.17/addon/lint/lint.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.17/addon/lint/javascript-lint.min.js"></script>
  <!-- JSHint for JS linting -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jshint/2.13.6/jshint.min.js"></script>
  <style>
    @media print {
      body * { visibility: hidden; }
      .pages-container, .pages-container * { visibility: visible; }
      .pages-container { position: absolute; left: 0; top: 0; width: 100%; }
      .page-sheet { box-shadow: none !important; transform: none !important; margin: 0 !important; page-break-after: always; }
      .page-side-btns, .format-toolbar, .fmt-tray, .sidebar { display: none !important; }
      .page-header-editable, .page-footer-editable { border: none !important; }
    }
  </style>
</head>
<body>

  <!-- ── Full-width search overlay (outside sidebar so it can escape it) ── -->
  <div class="search-overlay hidden" id="search-overlay">
    <div class="search-overlay-bar">
      <span class="search-icon" aria-hidden="true">
        <svg class="icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"></circle><path d="m16 16 4 4"></path></svg>
      </span>
      <input type="text" class="search-input" placeholder="Search notes..." id="search-input" />
      <button class="search-close-btn" id="search-close-btn">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg>
        Close
      </button>
    </div>
    <div class="search-overlay-results" id="panel-search">
      <!-- search results render here -->
    </div>
  </div>

  <div class="app">

    <!-- ── Sidebar ── -->
    <aside class="sidebar">

      <!-- Sidebar Top: logo + search trigger + menu -->
      <div class="sidebar-top">
        <a href="index.html" class="home-btn" title="Back to home" aria-label="Back to home">
          <svg class="icon palm-home-icon" viewBox="0 0 96 96" aria-hidden="true">
            <path d="M42 38c-8-10-20-18-36-20 10-9 29 1 39 13-4-13-13-22-28-28 17-5 31 7 35 24 7-15 20-23 38-19-7 2-22 13-29 27 13-10 25-11 35-4-11 1-26 8-38 20 8-1 17 2 25 8-12 0-23-3-32-7-2 4-3 9-4 15l-3 22H31l5-24c2-8 4-15 6-21-10 0-21 4-31 11 7-11 18-17 31-17Z"></path>
            <path d="M24 89h48v6H24z"></path>
          </svg>
        </a>
        <div class="search-group">
          <button class="back-btn" id="back-btn" aria-label="Go back" title="Go back" disabled>
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg>
          </button>
          <button class="back-btn" id="forward-btn" aria-label="Go forward" title="Go forward" disabled>
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 14l5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/></svg>
          </button>
          <button class="search-trigger" id="search-trigger" aria-label="Search">
            <span class="search-icon" aria-hidden="true">
              <svg class="icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"></circle><path d="m16 16 4 4"></path></svg>
            </span>
            <span class="search-trigger-text">Search...</span>
          </button>
        </div>
        <button class="folder-nav-btn" id="folder-nav-btn" aria-label="Folders" title="Folders">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h5l2 2h7a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"></path></svg>
        </button>
        <!-- View toggle -->
        <div class="view-toggle" id="view-toggle">
          <button class="view-toggle-btn active" id="view-scroll-btn" title="Continuous scroll" aria-label="Continuous scroll">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
          </button>
          <button class="view-toggle-btn" id="view-pages-btn" title="Page view" aria-label="Page view">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="2" width="16" height="20" rx="2"/><line x1="8" y1="7" x2="16" y2="7"/><line x1="8" y1="11" x2="16" y2="11"/><line x1="8" y1="15" x2="13" y2="15"/></svg>
          </button>
        </div>

        <div class="menu-wrap">
          <button class="menu-btn" id="menu-btn" aria-label="Menu">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="1"></circle><circle cx="19" cy="12" r="1"></circle><circle cx="5" cy="12" r="1"></circle></svg>
          </button>
          <div class="menu-dropdown hidden" id="menu-dropdown">
            <button class="menu-item" id="export-btn">Export as JSON</button>
            <button class="menu-item" id="import-btn">Import JSON</button>
            <input type="file" id="import-file" accept=".json" class="hidden" />
            <hr class="menu-divider" />
            <button class="menu-item danger" id="clear-btn">Delete all notes</button>
          </div>
        </div>
      </div>

      <!-- Two Tabs -->
      <div class="tabs">
        <button class="tab-btn active" id="tab-recent" aria-label="Recent notes" title="Recent">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"></path><path d="M14 2v6h6"></path><path d="M8 13h8"></path><path d="M8 17h5"></path></svg>
        </button>
        <button class="tab-btn" id="tab-months" aria-label="By month" title="By month">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 2v4"></path><path d="M16 2v4"></path><rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M3 10h18"></path><path d="M8 14h.01"></path><path d="M12 14h.01"></path><path d="M16 14h.01"></path><path d="M8 18h.01"></path><path d="M12 18h.01"></path></svg>
        </button>
        <button class="tab-btn" id="tab-multiselect" aria-label="Select notes" title="Select notes">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" fill="currentColor" stroke="none"><circle cx="5" cy="12" r="1.5"></circle><circle cx="12" cy="12" r="1.5"></circle><circle cx="19" cy="12" r="1.5"></circle></svg>
        </button>
      </div>

      <!-- Bulk action bar (shown during multi-select) -->
      <div class="bulk-bar hidden" id="bulk-bar">
        <span class="bulk-count" id="bulk-count">0 selected</span>
        <div class="bulk-actions">
          <button class="bulk-btn" id="bulk-folder-btn">Add to folder</button>
          <button class="bulk-btn danger" id="bulk-delete-btn">Delete</button>
          <button class="bulk-btn ghost" id="bulk-cancel-btn">Cancel</button>
        </div>
      </div>

      <!-- Tab Panels -->
      <div class="tab-panel active" id="panel-recent">
        <!-- notes list renders here -->
      </div>

      <div class="tab-panel hidden" id="panel-months">
        <!-- months render here -->
      </div>

      <!-- New Note -->
      <div class="sidebar-footer">
        <button class="new-note-btn" id="new-note-btn">+ New Note</button>
      </div>

    </aside>

    <!-- ── Editor ── -->
    <main class="editor">
      <!-- Folder view (shown instead of editor when folders open) -->
      <div class="folder-view hidden" id="folder-view">
        <div class="folder-view-inner" id="folder-view-inner">
          <!-- rendered by folders.js -->
        </div>
      </div>

      <div class="editor-meta">
        <span class="unsaved-dot" id="unsaved-dot"></span>
      </div>
      <textarea
        class="editor-title"
        id="editor-title"
        placeholder="Title"
        rows="1"
        spellcheck="false"
      ></textarea>
      <div
        class="editor-body"
        id="editor-body"
        contenteditable="true"
        spellcheck="true"
        data-placeholder="Start writing..."
      ></div>

      <!-- ── Ruler (page view only) ── -->
      <div class="page-ruler hidden" id="page-ruler">
        <div class="ruler-track" id="ruler-track">
          <div class="ruler-ticks" id="ruler-ticks"></div>
          <div class="ruler-margin-left" id="ruler-margin-left"></div>
          <div class="ruler-margin-right" id="ruler-margin-right"></div>
          <div class="ruler-indent-first" id="ruler-indent-first">
            <div class="ruler-indent-top"></div>
            <div class="ruler-indent-bottom"></div>
          </div>
        </div>
      </div>

      <!-- ── Pages container (page view only) ── -->
      <div class="pages-container hidden" id="pages-container"></div>

      <!-- ── Page side buttons ── -->
      <div class="page-side-btns hidden" id="page-side-btns">

        <!-- Page settings panel -->
        <div class="page-settings" id="page-settings">
          <button class="page-settings-toggle" id="page-settings-toggle" title="Page settings">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="16" height="16"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
          </button>
          <div class="page-settings-panel hidden" id="page-settings-panel">
            <div class="ps-label">Preset</div>
            <select class="ps-select" id="ps-preset">
              <option value="a4">A4</option>
              <option value="letter">Letter</option>
              <option value="legal">Legal</option>
              <option value="custom">Custom</option>
            </select>

            <div class="ps-label">Width (mm)</div>
            <input class="ps-input" type="number" id="ps-width" value="210" min="50" max="500">

            <div class="ps-label">Height (mm)</div>
            <input class="ps-input" type="number" id="ps-height" value="297" min="50" max="800">

            <div class="ps-label">Margin (mm)</div>
            <input class="ps-input" type="number" id="ps-margin" value="20" min="0" max="60">

            <button class="ps-apply" id="ps-apply">Apply</button>
          </div>
        </div>

        <button class="page-side-btn" id="add-page-btn" title="Add page" aria-label="Add page">+</button>
        <button class="page-side-btn" id="del-page-btn" title="Delete page" aria-label="Delete page">−</button>
        <div class="page-side-divider"></div>
        <!-- Zoom control -->
        <div class="page-zoom-wrap" id="page-zoom-wrap">
          <button class="page-side-btn page-zoom-btn" id="zoom-out-btn" title="Zoom out" aria-label="Zoom out">−</button>
          <span class="page-zoom-label" id="zoom-label">85%</span>
          <button class="page-side-btn page-zoom-btn" id="zoom-in-btn" title="Zoom in" aria-label="Zoom in">+</button>
        </div>
        <div class="page-side-divider"></div>
        <!-- Line spacing -->
        <div class="page-linespacing-wrap" id="page-linespacing-wrap">
          <select class="page-side-select" id="line-spacing-select" title="Line spacing" aria-label="Line spacing">
            <option value="1">1×</option>
            <option value="1.15">1.15×</option>
            <option value="1.5" selected>1.5×</option>
            <option value="2">2×</option>
            <option value="2.5">2.5×</option>
          </select>
        </div>
        <div class="page-side-divider"></div>
        <button class="page-side-btn" id="print-page-btn" title="Print / Export PDF" aria-label="Print or export PDF">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="16" height="16"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>
        </button>
      </div>

      <!-- ── Formatting Toolbar (two-layer) ── -->

      <!-- Layer 1: Inline tray — slides up when A is tapped -->
      <div class="fmt-tray" id="fmt-tray">
        <button class="fmt-btn" data-cmd="bold" title="Bold (Ctrl+B)" aria-label="Bold">
          <svg class="icon" viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M6 4h8a4 4 0 0 1 4 4 4 4 0 0 1-4 4H6z"/><path d="M6 12h9a4 4 0 0 1 4 4 4 4 0 0 1-4 4H6z"/></svg>
        </button>
        <button class="fmt-btn" data-cmd="italic" title="Italic (Ctrl+I)" aria-label="Italic">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"><line x1="19" y1="4" x2="10" y2="4"/><line x1="14" y1="20" x2="5" y2="20"/><line x1="15" y1="4" x2="9" y2="20"/></svg>
        </button>
        <button class="fmt-btn" data-cmd="underline" title="Underline (Ctrl+U)" aria-label="Underline">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M6 4v6a6 6 0 0 0 12 0V4"/><line x1="4" y1="20" x2="20" y2="20"/></svg>
        </button>
        <div class="fmt-divider"></div>
        <button class="fmt-btn fmt-heading-btn" data-heading="h1" title="Heading 1" aria-label="Heading 1">H1</button>
        <button class="fmt-btn fmt-heading-btn" data-heading="h2" title="Heading 2" aria-label="Heading 2">H2</button>
        <button class="fmt-btn fmt-heading-btn" data-heading="h3" title="Heading 3" aria-label="Heading 3">H3</button>
        <div class="fmt-divider"></div>
        <!-- Alignment -->
        <button class="fmt-btn" data-cmd="justifyLeft" title="Align left" aria-label="Align left">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="15" y2="12"/><line x1="3" y1="18" x2="18" y2="18"/></svg>
        </button>
        <button class="fmt-btn" data-cmd="justifyCenter" title="Align center" aria-label="Align center">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="6" y1="12" x2="18" y2="12"/><line x1="4" y1="18" x2="20" y2="18"/></svg>
        </button>
        <button class="fmt-btn" data-cmd="justifyRight" title="Align right" aria-label="Align right">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="9" y1="12" x2="21" y2="12"/><line x1="6" y1="18" x2="21" y2="18"/></svg>
        </button>
        <button class="fmt-btn" data-cmd="justifyFull" title="Justify" aria-label="Justify">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        </button>
        <div class="fmt-divider"></div>
        <!-- Font size -->
        <div class="fmt-fontsize-wrap" id="fmt-fontsize-wrap">
          <button class="fmt-btn fmt-fontsize-dec" id="fmt-fontsize-dec" title="Decrease font size" aria-label="Decrease font size">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="5" y1="12" x2="19" y2="12"/></svg>
          </button>
          <span class="fmt-fontsize-label" id="fmt-fontsize-label">16</span>
          <button class="fmt-btn fmt-fontsize-inc" id="fmt-fontsize-inc" title="Increase font size" aria-label="Increase font size">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          </button>
        </div>
        <div class="fmt-divider"></div>
        <button class="fmt-btn" id="fmt-link-btn" title="Insert link" aria-label="Insert link">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
        </button>
      </div>

      <!-- Link modal -->
      <div class="link-modal-overlay hidden" id="link-modal-overlay">
        <div class="link-modal">
          <div class="link-modal-label">Insert link</div>
          <input class="link-modal-input" id="link-modal-url" type="url" placeholder="https://..." />
          <div class="link-modal-actions">
            <button class="link-modal-cancel" id="link-modal-cancel">Cancel</button>
            <button class="link-modal-confirm" id="link-modal-confirm">Insert</button>
          </div>
        </div>
      </div>

      <!-- Layer 2: Always-visible bottom bar -->
      <div class="format-toolbar" id="format-toolbar">
        <!-- Bullet list -->
        <button class="fmt-btn" data-cmd="insertUnorderedList" title="Bullet list" aria-label="Bullet list">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="9" y1="6" x2="20" y2="6"/><line x1="9" y1="12" x2="20" y2="12"/><line x1="9" y1="18" x2="20" y2="18"/><circle cx="4" cy="6" r="1.5" fill="currentColor" stroke="none"/><circle cx="4" cy="12" r="1.5" fill="currentColor" stroke="none"/><circle cx="4" cy="18" r="1.5" fill="currentColor" stroke="none"/></svg>
        </button>
        <!-- Numbered list -->
        <button class="fmt-btn" data-cmd="insertOrderedList" title="Numbered list" aria-label="Numbered list">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="10" y1="6" x2="21" y2="6"/><line x1="10" y1="12" x2="21" y2="12"/><line x1="10" y1="18" x2="21" y2="18"/><text x="1" y="8" font-size="6" fill="currentColor" stroke="none" font-family="sans-serif">1</text><text x="1" y="13.5" font-size="6" fill="currentColor" stroke="none" font-family="sans-serif">2</text><text x="1" y="19" font-size="6" fill="currentColor" stroke="none" font-family="sans-serif">3</text></svg>
        </button>
        <!-- Indent -->
        <button class="fmt-btn" data-cmd="indent" title="Indent" aria-label="Indent">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/><polyline points="9 8 13 12 9 16"/><line x1="3" y1="12" x2="13" y2="12"/></svg>
        </button>
        <!-- Outdent -->
        <button class="fmt-btn" data-cmd="outdent" title="Outdent" aria-label="Outdent">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/><polyline points="7 8 3 12 7 16"/><line x1="3" y1="12" x2="21" y2="12"/></svg>
        </button>

        <div class="fmt-divider"></div>

        <!-- Image insert -->
        <button class="fmt-btn" id="fmt-img-btn" title="Insert image" aria-label="Insert image">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
        </button>
        <input type="file" id="fmt-img-input" accept="image/*" style="display:none;" />

        <!-- Code block -->
        <button class="fmt-btn" id="fmt-code-btn" title="Code block" aria-label="Code block">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>
        </button>

        <!-- Table insert -->
        <button class="fmt-btn" id="fmt-table-btn" title="Insert table" aria-label="Insert table">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="1"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="3" y1="15" x2="21" y2="15"/><line x1="9" y1="3" x2="9" y2="21"/><line x1="15" y1="3" x2="15" y2="21"/></svg>
        </button>

        <!-- Table picker popover -->
        <div class="table-picker-overlay hidden" id="table-picker-overlay">
          <div class="table-picker" id="table-picker">
            <div class="table-picker-grid" id="table-picker-grid"></div>
            <div class="table-picker-label" id="table-picker-label">Insert table</div>
          </div>
        </div>

        <!-- A button — opens/closes the formatting tray -->
        <button class="fmt-btn fmt-a-btn" id="fmt-a-btn" title="Formatting" aria-label="Formatting options" aria-expanded="false">
          <span>A</span>
        </button>
      </div>
    </main>

  </div>

  <script src="js/storage.js"></script>
  <script src="js/search.js"></script>
  <script src="js/notes.js"></script>
  <script src="js/folders.js"></script>
  <script src="js/export.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
