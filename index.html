<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <title>Palm Tree</title>

          <button class="carousel-btn" id="prev-btn" aria-label="Previous">&#8592;</button>
          <button class="carousel-btn" id="next-btn" aria-label="Next">&#8594;</button>

      </div>

      <div class="divider"></div>

      <div class="right-col">
        <p class="cta-text">

          start it off <a href="app.html" class="cta-now">now!</a>
